# EvaWM desktop portal selection.
#
# Install this as ~/.config/xdg-desktop-portal/evawm-portals.conf (or
# /usr/share/xdg-desktop-portal/evawm-portals.conf). EvaWM exports
# XDG_CURRENT_DESKTOP=evawm, so xdg-desktop-portal picks this file only for
# EvaWM sessions and leaves niri/other desktops on their own portal backends.
#
# ScreenCast/Screenshot are monitor/region only through xdg-desktop-portal-wlr.
# Use xdg-desktop-portal-wlr >= 0.8.5: 0.8.4 stalls after the first frame.
# Window-only sharing is intentionally not supported.
[preferred]
default=gtk
org.freedesktop.impl.portal.Screenshot=wlr
org.freedesktop.impl.portal.ScreenCast=wlr
